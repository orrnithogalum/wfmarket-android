name: Site contract

# warframe.market can change its API without notice. Once a week, and whenever you ask, this runs
# the live tests against the real site, so a change shows up here before it shows up in the app.
# With the WFM_EMAIL and WFM_PASSWORD secrets set, the signed-in tests run too; they remove what
# they create. Without them, those tests are skipped.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Live tests
        env:
          WFM_EMAIL: ${{ secrets.WFM_EMAIL }}
          WFM_PASSWORD: ${{ secrets.WFM_PASSWORD }}
        run: ./gradlew :api:test -Plive
