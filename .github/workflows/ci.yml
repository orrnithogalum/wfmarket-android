name: CI

# Every push to master or main, and every pull request, is tested, linted and built, in three jobs
# that run side by side. Lint and detekt findings show up under Security › Code scanning.
on:
  push:
    branches: [master, main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# A new push to the same branch cancels the previous, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pull requests from forks can't write checks or code scanning results, so those steps skip.
  SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle's downloads and build outputs, and checks the wrapper jar is the genuine one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The live tests against warframe.market run on their own schedule, in contract.yml.
      - name: Unit tests, with coverage
        run: ./gradlew :api:koverXmlReport :app:koverXmlReportDebug

      - name: Report the results
        if: always() && env.SAME_REPO == 'true'
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: Unit test results
          detailed_summary: true
          include_passed: false

      - name: Summarize the coverage
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          print("### Line coverage\n\n| Module | Covered | Lines |\n| --- | ---: | ---: |")
          for name, path in (("api", "api/build/reports/kover/report.xml"), ("app", "app/build/reports/kover/reportDebug.xml")):
              if not os.path.exists(path):
                  continue
              counters = {c.get("type"): c for c in ET.parse(path).getroot().findall("counter")}
              covered, missed = int(counters["LINE"].get("covered")), int(counters["LINE"].get("missed"))
              print(f"| `{name}` | {100 * covered / max(covered + missed, 1):.1f}% | {covered + missed} |")
          PY

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            api/build/reports/tests/
            app/build/reports/tests/
            api/build/reports/kover/
            app/build/reports/kover/
          retention-days: 14

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Android Lint, and detekt against its baselines, so only new findings fail the build.
      - name: Lint and detekt
        run: ./gradlew :app:lintDebug :api:detekt :app:detekt --continue

      - name: Send Android Lint's findings to code scanning
        if: always() && env.SAME_REPO == 'true' && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Send detekt's findings to code scanning
        if: always() && env.SAME_REPO == 'true' && hashFiles('app/build/reports/detekt/detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif
          category: detekt-app

      - name: Send detekt's findings on the api module to code scanning
        if: always() && env.SAME_REPO == 'true' && hashFiles('api/build/reports/detekt/detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: api/build/reports/detekt/detekt.sarif
          category: detekt-api

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.*
            api/build/reports/detekt/
            app/build/reports/detekt/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The release build runs R8, which catches shrinking problems before a release does. Without
      # the release key it signs with the runner's debug key, so it's only checked, not kept.
      - name: Build the debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Report the APK sizes
        run: |
          {
            echo "### APK sizes"
            echo
            echo "| APK | Size |"
            echo "| --- | ---: |"
            for apk in app/build/outputs/apk/*/*.apk; do
              echo "| \`$(basename "$apk")\` | $(du -h "$apk" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: wfmarket-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
